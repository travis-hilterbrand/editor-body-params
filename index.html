<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Monaco JSON Schema Example</title>

  <style>
    html,
    body,
    #container {
      margin: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      height: 90vh;
    }

    #output {
      height: 10vh;
      background: #f0f0f0;
      padding: 8px;
      overflow: hidden auto;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="output"></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

  <script>
    require.config({
      paths: {
        vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"
      }
    });

    require(["vs/editor/editor.main"], function () {

      // Configure JSON schema
      monaco.languages.json.jsonDefaults.setDiagnosticsOptions({
        validate: true,
        allowComments: false,
        schemas: [
          {
            uri: "http://my-schema/user-schema.json",

            // Which files this schema applies to
            fileMatch: ["*"],

            schema: {
              $ref: "#/definitions/BodyParamType",

              definitions: {
                BodyParamType: {
                  type: "object",

                  required: [
                    "type",
                    "value_type",
                    "id",
                    "description",
                    "required"
                  ],

                  properties: {
                    type: {
                      type: "string",
                      enum: [
                        "array",
                        "boolean",
                        "enum",
                        "integer",
                        "number",
                        "object",
                        "string"
                      ],
                      description: "Parameter data type"
                    },

                    value_type: {
                      type: "string",
                      enum: [
                        "constant",
                        "dynamic",
                        "prompt"
                      ],
                      description: "How the parameter value is provided"
                    },

                    id: {
                      type: "string",
                      minLength: 1,
                      description: "Unique parameter id"
                    },

                    description: {
                      type: "string",
                      description: "Human-readable description"
                    },

                    required: {
                      type: "boolean",
                      description: "Whether this parameter is required"
                    },

                    constant_value: {
                      type: "string",
                      description: "Literal value used when value_type is constant"
                    },

                    dynamic_variable: {
                      type: "string",
                      description: "Variable name used when value_type is dynamic"
                    },

                    properties: {
                      type: "array",
                      minItems: 1,
                      description: "Nested child parameters",
                      items: {
                        $ref: "#/definitions/BodyParamType"
                      }
                    }
                  },

                  additionalProperties: false,

                  allOf: [
                    {
                      if: {
                        properties: {
                          type: {
                            const: "object"
                          }
                        }
                      },
                      then: {
                        required: ["properties"]
                      }
                    },
                    {
                      if: {
                        properties: {
                          value_type: {
                            const: "constant"
                          }
                        }
                      },
                      then: {
                        required: ["constant_value"]
                      }
                    },
                    {
                      if: {
                        properties: {
                          value_type: {
                            const: "dynamic"
                          }
                        }
                      },
                      then: {
                        required: ["dynamic_variable"]
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      });

      // Create model
      const model = monaco.editor.createModel(
        `{
  "type": "string",
  "value_type": "constant",
  "id": "constant_string",
  "description": "",
  "required": true
}`,
        "json",
        monaco.Uri.parse("file:///config.json")
      );

      // Create editor
      const editor = monaco.editor.create(
        document.getElementById("container"),
        {
          model,

          theme: "hc-light",

          automaticLayout: true,

          // Force diagnostics to render even when the editor is not focused.
          renderValidationDecorations: "on",
          glyphMargin: true,

          minimap: {
            enabled: false
          },

          formatOnPaste: true,
          formatOnType: true,

          quickSuggestions: true,
          suggestOnTriggerCharacters: true
        }
      );

      function renderStringArrayToOutput(items) {
        const output = document.getElementById("output");
        output.replaceChildren();

        const list = document.createElement("ul");
        list.style.margin = "0";
        list.style.paddingLeft = "20px";

        items.forEach(function (item) {
          const row = document.createElement("li");
          row.textContent = item;
          list.appendChild(row);
        });

        output.appendChild(list);
      }

      function logJsonDiagnostics(reason) {
        const markers = monaco.editor.getModelMarkers({
          resource: model.uri
        });
        console.log("[Monaco JSON]", reason, {
          modelUri: model.uri.toString(),
          markers
        });

        if (markers.length > 0) {
          renderStringArrayToOutput(
            markers.map(function (marker) {
              return "L" + marker.startLineNumber + ": " + marker.message;
            })
          );

          const first = markers[0];
          editor.revealPositionInCenter({
            lineNumber: first.startLineNumber,
            column: first.startColumn
          });
        } else {
          renderStringArrayToOutput(["No validation errors."]);
        }
      }

      console.log("[Monaco JSON] active model URI:", model.uri.toString());
      logJsonDiagnostics("initial");

      model.onDidChangeContent(function () {
        logJsonDiagnostics("content-change");

      });

      monaco.editor.onDidChangeMarkers(function () {
        logJsonDiagnostics("markers-change");
      });
    });
  </script>
</body>

</html>
